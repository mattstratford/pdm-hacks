<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breadboard</title>
<style>
/* Layout: two panes side by side. Left is a lined notepad for the outline; right is a framed whiteboard. */
:root{
  --ink:#1c1d21; --blue:#1f4fa8; --red:#c8312b; --green:#1f7a45;
  --board:#fdfdfb; --frame:#b4b9be; --desk:#e3e6e2; --paper:#f7f7f2; --rule:#d9dcd5; --muted:#676c73;
  --marker:"Marker Felt","Kalam","Chalkboard SE","Comic Sans MS",cursive;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{display:flex;height:100%}
#left{flex:0 0 36%;min-width:200px;display:flex;flex-direction:column;background:var(--paper)}
#right{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
#divider{flex:0 0 9px;cursor:col-resize;background:var(--desk);position:relative;touch-action:none}
#divider::after{content:"";position:absolute;inset:40% 3px;border-radius:2px;background:var(--frame)}
#divider:hover::after,#divider.drag::after{background:var(--muted)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px}
.bar .spacer{flex:1}
button{font:16px/1 var(--marker);color:var(--ink);background:#fff;border:2px solid var(--ink);
  border-radius:255px 14px 225px 14px/14px 225px 14px 255px;padding:6px 12px;cursor:pointer}
button:hover{background:#eef1f6}
button[aria-pressed="true"]{background:var(--ink);color:#fff}
button:focus-visible,textarea:focus-visible,.swatch:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#fileName{font:13px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

#outline{flex:1;width:100%;resize:none;border:0;border-top:1px solid var(--rule);outline-offset:-3px;
  padding:14px 16px;font:15px/28px var(--mono);color:var(--ink);tab-size:2;white-space:pre-wrap;overflow-wrap:break-word;overflow-x:hidden;overflow-y:auto;
  background:repeating-linear-gradient(var(--paper) 0 27px,var(--rule) 27px 28px) local 0 14px}
#left{position:relative}
#mirror{position:absolute;visibility:hidden;pointer-events:none;padding:14px 16px;font:15px/28px var(--mono);tab-size:2;
  white-space:pre-wrap;overflow-wrap:break-word;height:0;overflow:hidden}
#ac{position:absolute;z-index:6;min-width:160px;max-width:80%;background:#fff;border:2px solid var(--ink);border-radius:8px;
  padding:4px;box-shadow:3px 4px 0 rgba(0,0,0,.15);font:15px/1.3 var(--mono)}
#ac div{padding:5px 9px;border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ac div[aria-selected="true"]{background:var(--ink);color:#fff}
#hint{padding:8px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--rule)}
#hint code{font-family:var(--mono);color:var(--ink)}

.swatches{display:flex;gap:6px;align-items:center}
.swatch{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--muted)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
#exportWrap{position:relative}
#exportMenu{position:absolute;right:0;top:calc(100% + 6px);z-index:5;background:#fff;border:2px solid var(--ink);
  border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:190px;box-shadow:3px 4px 0 rgba(0,0,0,.15)}
#exportMenu button{border:0;border-radius:6px;text-align:left;padding:8px 10px}
#exportMenu small{font:11px var(--mono);color:var(--muted);float:right;margin-top:3px}

#boardWrap{flex:1;min-height:0;overflow:auto;margin:0 12px 12px 3px;border:7px solid var(--frame);
  border-color:#cfd3d7 #a9aeb4 #9a9fa5 #c2c6ca;border-radius:7px;
  background:linear-gradient(115deg,#fff 0%,#fbfcfb 38%,#f2f4f3 58%,#fdfdfc 100%);
  box-shadow:inset 0 0 14px rgba(0,0,0,.07),0 2px 5px rgba(0,0,0,.15)}
#stage{position:relative}
#board{display:block}
#board.draw{cursor:crosshair;touch-action:none}
#board.text{cursor:text}
.note{position:absolute;height:28px;min-width:160px;padding:0;border:0;border-bottom:2px dashed var(--muted);
  background:rgba(255,255,255,.7);font:22px/28px var(--marker);outline:none}

@media (max-width:700px){
  #app{flex-direction:column}
  #left{flex-basis:40%;min-width:0;min-height:120px}
  #divider{cursor:row-resize}
  #divider::after{inset:3px 40%}
  #boardWrap{margin:0 8px 8px}
}
</style>
</head>
<body>
<div id="app">
  <section id="left" aria-label="Outline">
    <div class="bar">
      <button id="btnNew" title="New outline">New</button>
      <button id="btnOpen" title="Open a Markdown file (Cmd/Ctrl+O)">Open</button>
      <button id="btnSave" title="Save as Markdown (Cmd/Ctrl+S)">Save</button>
      <span id="fileName">untitled.md</span>
    </div>
    <textarea id="outline" spellcheck="false" aria-label="Outline editor"></textarea>
    <div id="mirror" aria-hidden="true"></div>
    <div id="ac" role="listbox" aria-label="Places" hidden></div>
    <div id="hint"><code>- Place</code> &middot; nested <code>- Affordance</code> &middot; link with <code>- Affordance -&gt; Place</code> &middot; after <code>-&gt;</code> pick a place with the arrow keys and Enter &middot; Tab nests, Shift-Tab un-nests &middot; text without a bullet is a note</div>
  </section>

  <div id="divider" role="separator" aria-label="Resize panes"></div>

  <section id="right" aria-label="Breadboard">
    <div class="bar">
      <button id="toolText" data-tool="text" aria-pressed="false" title="Click the board to write a note">Text</button>
      <button id="toolDraw" data-tool="draw" aria-pressed="false" title="Draw freehand on the board">Draw</button>
      <span class="swatches" role="group" aria-label="Marker colour">
        <button class="swatch" data-color="#c8312b" style="background:#c8312b" aria-pressed="true" title="Red"></button>
        <button class="swatch" data-color="#1f7a45" style="background:#1f7a45" aria-pressed="false" title="Green"></button>
        <button class="swatch" data-color="#1f4fa8" style="background:#1f4fa8" aria-pressed="false" title="Blue"></button>
        <button class="swatch" data-color="#1c1d21" style="background:#1c1d21" aria-pressed="false" title="Black"></button>
      </span>
      <button id="btnUndo" title="Remove the last mark">Undo</button>
      <button id="btnWipe" title="Remove all marks">Wipe marks</button>
      <span class="spacer"></span>
      <span id="exportWrap">
        <button id="btnExport" aria-haspopup="true" aria-expanded="false">Export</button>
        <div id="exportMenu" hidden>
          <button data-fmt="jpg">Board as image <small>.jpg</small></button>
          <button data-fmt="pdf">Board as PDF <small>.pdf</small></button>
          <button data-fmt="docx">Outline for Word <small>.docx</small></button>
          <button data-fmt="opml">Outline as OPML <small>.opml</small></button>
          <button data-fmt="md">Outline as Markdown <small>.md</small></button>
        </div>
      </span>
    </div>
    <div id="boardWrap"><div id="stage"><canvas id="board"></canvas></div></div>
  </section>
</div>
<input type="file" id="filePick" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>

<script>
"use strict";
/* ============================================================
   Breadboard. One file, no dependencies.
   Sections: 1 state · 2 parse · 3 layout · 4 draw · 5 editor
             6 markup tools · 7 platform (file IO) · 8 exporters · 9 wiring
   To port to a native Mac app, load this page in a WKWebView and
   replace section 7 (platform) with calls to native code.
   ============================================================ */

/* ---------- 1. state ---------- */
const $ = id => document.getElementById(id);
const ed = $('outline'), canvas = $('board'), wrap = $('boardWrap'), stage = $('stage');
const ctx = canvas.getContext('2d');

const FAMILY = '"Marker Felt","Kalam","Chalkboard SE","Comic Sans MS",cursive';
const FONT = '20px ' + FAMILY, NOTE_FONT = '22px ' + FAMILY, TITLE_FONT = '30px ' + FAMILY;
const INK = '#1c1d21', PURPLE = '#7b3fb5', MUTED = '#8a8f96', BOARD = '#fdfdfb';
const PAD = 64, TITLE_H = 64, HOP = 6, GAP_X = 90, GAP_Y = 34, PLACE_H = 34, AFF_H = 28;

const SAMPLE = [
  '# Autopay',
  '',
  'Lines without a bullet are notes. They stay off the board.',
  '',
  '- Invoice',
  '  - Turn on Autopay -> Setup Autopay',
  '- Setup Autopay',
  '  - CC fields',
  '  - FI logo',
  '  - Submit -> Confirm',
  '  - Cancel -> Invoice',
  '- Confirm',
  '  - Thank you message',
  '- Customer list',
  '  - Customer detail',
  '    - Customer page',
  '      - Disable Autopay',
  ''
].join('\n');

let scene = { nodes: [], w: 0, h: 0 };
let marks = [];            // {type:'path',color,pts:[[x,y],...]} | {type:'text',color,x,y,text}
let tool = null, color = '#c8312b', stroke = null;
let fileHandle = null, fileName = 'untitled.md', dirty = false;

/* ---------- 2. parse: outline text -> places, affordances and links ----------
   - A top-level bullet is a place.
   - A bullet nested under a place is one of its affordances.
   - "Affordance -> Place name" links that affordance to the named place.
   - A bullet nested under an affordance is the place it leads to (shorthand for the arrow).
   - Lines that are not bullets are ignored. */
const ARROW = /\s*(?:->|→)\s*/;
// The board title: a "# Heading" on the first non-blank line of the file.
function docTitle(text) {
  for (const line of text.split('\n')) {
    if (!line.trim()) continue;
    const m = line.match(/^#[ \t]+(.+)$/);
    return m ? m[1].trim() : '';
  }
  return '';
}
function bulletTree(text) {
  const roots = [], stack = [];
  for (const raw of text.split('\n')) {
    const m = raw.match(/^([ \t]*)[-*+][ \t]+(.*)$/);
    if (!m) continue;
    const body = m[2].trim();
    if (!body) continue;
    let cols = 0;
    for (const ch of m[1]) cols += ch === '\t' ? 2 : 1;
    while (stack.length && stack[stack.length - 1].cols >= cols) stack.pop();
    const parts = body.split(ARROW).map(s => s.trim());
    const item = { text: body, label: parts[0], targets: parts.slice(1).filter(Boolean), children: [] };
    (stack.length ? stack[stack.length - 1].item.children : roots).push(item);
    stack.push({ cols, item });
  }
  return roots;
}
function buildGraph(tree) {
  const map = new Map(), places = [];
  const get = name => {
    const key = name.toLowerCase();
    let p = map.get(key);
    if (!p) { p = { key, name, affs: [], self: [] }; map.set(key, p); places.push(p); }
    return p;
  };
  const addPlace = item => {
    const p = get(item.label || 'Untitled');     // the same name twice means the same place
    p.self.push(...item.targets);
    for (const a of item.children) {
      const aff = { label: a.label, targets: [...a.targets] };
      p.affs.push(aff);
      for (const sub of a.children) aff.targets.push(addPlace(sub).name);
    }
    return p;
  };
  tree.forEach(addPlace);
  // Turn target names into places. A name that is not defined anywhere becomes an empty place.
  for (let i = 0; i < places.length; i++) {
    const p = places[i];
    p.self = p.self.map(get);
    for (const a of p.affs) a.targets = a.targets.map(get);
  }
  return places;
}

/* ---------- 3. layout: a place sits one column right of whatever first leads to it ---------- */
function layout(places, title) {
  ctx.font = FONT;
  const targeted = new Set();
  for (const p of places) {
    p.pw = ctx.measureText(p.name).width;
    p.aw = p.affs.map(a => ctx.measureText(a.label).width);
    p.w = Math.max(70, p.pw, ...p.aw) + 14;
    p.h = PLACE_H + p.affs.length * AFF_H + 8;
    p.kids = []; p.d = -1;
    p.edges = [...p.self.map(t => [-1, t]), ...p.affs.flatMap((a, i) => a.targets.map(t => [i, t]))];
    for (const e of p.edges) if (e[1] !== p) targeted.add(e[1]);
  }
  const visit = (p, d) => {
    p.d = d;
    for (const [i, t] of p.edges) if (t.d < 0) { p.kids.push({ i, node: t }); visit(t, d + 1); }
  };
  const roots = [];
  for (const p of places) if (!targeted.has(p)) { roots.push(p); visit(p, 0); }
  for (const p of places) if (p.d < 0) { roots.push(p); visit(p, 0); }   // places only reachable in a loop
  roots.sort((a, b) => places.indexOf(a) - places.indexOf(b));            // keep the order they were written in

  const colW = [];
  for (const p of places) colW[p.d] = Math.max(colW[p.d] || 0, p.w);
  const colX = [PAD];
  for (let d = 0; d < colW.length; d++) colX[d + 1] = colX[d] + colW[d] + GAP_X;
  function put(n, y) {
    n.x = colX[n.d]; n.y = y;
    let cy = y;
    for (const k of n.kids) {
      // try to sit level with the affordance that leads here
      cy = Math.max(cy, k.i < 0 ? y : y + PLACE_H + AFF_H * (k.i + 1) - 27);
      cy += put(k.node, cy) + GAP_Y;
    }
    return Math.max(n.h, n.kids.length ? cy - y - GAP_Y : 0);
  }
  let y = PAD + (title ? TITLE_H : 0);
  for (const r of roots) y += put(r, y) + GAP_Y * 1.6;
  let w = 0, h = 0;
  for (const n of places) { w = Math.max(w, n.x + n.w); h = Math.max(h, n.y + n.h); }

  // Connection lines: routed around every entity so they never run over text.
  const walls = [];
  if (title) {
    ctx.font = TITLE_FONT;
    const tw = ctx.measureText(title).width;
    w = Math.max(w, PAD + tw);
    walls.push({ x0: 0, y0: PAD - 14, x1: PAD + tw + 8, y1: PAD + 34 });
  }
  const route = makeRouter(places, w + PAD, h + PAD, walls);
  for (const p of places) {
    p.routes = p.edges.map(([i, t]) => {
      const rowY = i < 0 ? p.y + 16 : p.y + PLACE_H + AFF_H * (i + 1) - 11;
      const start = { x: i < 0 ? p.x + p.pw + 10 : p.x + p.aw[i] + 12, y: rowY };
      const tip = { x: t.x - 12, y: t.y + 16 };
      const C = route(p, rowY, t) || [];
      const n = C.length;
      if (n === 2) { C[0].y = rowY; C[1].y = tip.y; }
      else if (n > 2) {
        if (C[0].y === C[1].y) C[0].y = C[1].y = rowY;
        C[n - 1].y = C[n - 2].y = tip.y;
      }
      // drop points in the middle of a straight horizontal run, so each run is one stretch
      const pts = [start, ...C, tip].filter((q, k, arr) =>
        k === 0 || k === arr.length - 1 || Math.abs(arr[k - 1].y - q.y) > 5 || Math.abs(arr[k + 1].y - q.y) > 5);
      for (const q of pts) { w = Math.max(w, q.x); h = Math.max(h, q.y); }
      return { pts, hops: [] };
    });
  }

  // Line hops: where a horizontal stretch of one line crosses a vertical stretch of another,
  // the horizontal one jumps over.
  const all = places.flatMap(p => p.routes), vertical = [];
  for (const rt of all) for (let k = 1; k < rt.pts.length; k++) {
    const a = rt.pts[k - 1], b = rt.pts[k];
    if (Math.abs(a.x - b.x) < 1) vertical.push({ rt, x: a.x, y0: Math.min(a.y, b.y), y1: Math.max(a.y, b.y) });
  }
  for (const rt of all) for (let k = 1; k < rt.pts.length; k++) {
    const a = rt.pts[k - 1], b = rt.pts[k];
    rt.hops[k - 1] = [];
    if (Math.abs(a.y - b.y) > 5) continue;
    const lo = Math.min(a.x, b.x) + 20, hi = Math.max(a.x, b.x) - 20;      // keep clear of corners
    for (const v of vertical) {
      const y = a.y + (b.y - a.y) * ((v.x - a.x) / (b.x - a.x || 1));
      if (v.x > lo && v.x < hi && y > v.y0 + HOP && y < v.y1 - HOP) rt.hops[k - 1].push(v.x);
    }
    rt.hops[k - 1].sort((p, q) => (b.x > a.x ? p - q : q - p));
    rt.hops[k - 1] = rt.hops[k - 1].filter((x, n, arr) => n === 0 || Math.abs(x - arr[n - 1]) > HOP * 2 + 2);
  }
  return { nodes: places, w, h, title };
}

// Grid path-finder (A*). Entities are walls; lines leave from the right of the source
// and always arrive at the left of the target, taking whatever detour that needs.
const CELL = 8, CLEAR = 7, TURN = 5, SHARED = 8;
function makeHeap() {
  const f = [], v = [];
  return {
    get size() { return f.length; },
    push(F, V) {
      let i = f.length; f.push(F); v.push(V);
      while (i > 0) { const p = (i - 1) >> 1; if (f[p] <= F) break; f[i] = f[p]; v[i] = v[p]; i = p; }
      f[i] = F; v[i] = V;
    },
    pop() {
      const top = v[0], F = f.pop(), V = v.pop(), n = f.length;
      if (n) {
        let i = 0;
        for (;;) {
          let c = 2 * i + 1;
          if (c >= n) break;
          if (c + 1 < n && f[c + 1] < f[c]) c++;
          if (f[c] >= F) break;
          f[i] = f[c]; v[i] = v[c]; i = c;
        }
        f[i] = F; v[i] = V;
      }
      return top;
    }
  };
}
function makeRouter(places, W, H, walls) {
  const cols = Math.ceil(W / CELL) + 1, rows = Math.ceil(H / CELL) + 1, N = cols * rows;
  const blocked = new Uint8Array(N), pen = new Uint8Array(N);
  const g = new Float32Array(N * 4), prev = new Int32Array(N * 4);
  const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
  const cx0 = p => Math.max(0, Math.floor((p.x - 8 - CLEAR) / CELL));
  const cx1 = p => Math.min(cols - 1, Math.floor((p.x + p.w + 4 + CLEAR) / CELL));
  for (const p of places) {
    const y0 = Math.max(0, Math.floor((p.y + 2 - CLEAR) / CELL)), y1 = Math.min(rows - 1, Math.floor((p.y + p.h - 4 + CLEAR) / CELL));
    for (let y = y0; y <= y1; y++) for (let x = cx0(p); x <= cx1(p); x++) blocked[y * cols + x] = 1;
  }
  for (const r of walls) {
    for (let y = Math.max(0, Math.floor(r.y0 / CELL)); y <= Math.min(rows - 1, Math.floor(r.y1 / CELL)); y++)
      for (let x = Math.max(0, Math.floor(r.x0 / CELL)); x <= Math.min(cols - 1, Math.floor(r.x1 / CELL)); x++) blocked[y * cols + x] = 1;
  }
  return function (from, rowY, to) {
    const sx = Math.min(cols - 1, cx1(from) + 1), sy = Math.floor(rowY / CELL);
    const ex = Math.max(1, cx0(to) - 1), ey = Math.floor((to.y + 16) / CELL);
    const start = (sy * cols + sx) * 4, goal = (ey * cols + ex) * 4;   // direction 0 = heading right
    g.fill(Infinity);
    const heap = makeHeap();
    g[start] = 0; prev[start] = -1; heap.push(0, start);
    while (heap.size) {
      const s = heap.pop();
      if (s === goal) break;
      const d = s & 3, c = s >> 2, x = c % cols, y = (c - x) / cols;
      for (let nd = 0; nd < 4; nd++) {
        if (nd === ((d + 2) & 3)) continue;
        const nx = x + DX[nd], ny = y + DY[nd];
        if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
        const nc = ny * cols + nx;
        if (blocked[nc]) continue;
        const ns = nc * 4 + nd, ng = g[s] + 1 + (nd !== d ? TURN : 0) + pen[nc];
        if (ng < g[ns]) { g[ns] = ng; prev[ns] = s; heap.push(ng + Math.abs(nx - ex) + Math.abs(ny - ey), ns); }
      }
    }
    if (g[goal] === Infinity) return null;
    const cells = [];
    for (let s = goal; s !== -1; s = prev[s]) cells.push(s >> 2);
    cells.reverse();
    const pt = c => ({ x: (c % cols + 0.5) * CELL, y: (Math.floor(c / cols) + 0.5) * CELL });
    const out = [pt(cells[0])];
    for (let i = 1; i < cells.length - 1; i++) {
      pen[cells[i]] = Math.min(250, pen[cells[i]] + SHARED);         // later lines prefer their own lane
      if (cells[i] - cells[i - 1] !== cells[i + 1] - cells[i]) out.push(pt(cells[i]));
    }
    if (cells.length > 1) out.push(pt(cells[cells.length - 1]));
    return out;
  };
}

function bounds() {
  let w = scene.w, h = scene.h;
  for (const m of marks) {
    if (m.type === 'path') for (const p of m.pts) { w = Math.max(w, p[0]); h = Math.max(h, p[1]); }
    else { ctx.font = NOTE_FONT; w = Math.max(w, m.x + ctx.measureText(m.text).width); h = Math.max(h, m.y + 14); }
  }
  return { w, h };
}

/* ---------- 4. draw ---------- */
// Seeded random so each element keeps the same hand-drawn wobble between redraws.
function rng(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function () {
    h += 0x6D2B79F5; let t = h;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function wobblyLine(c, x1, y1, x2, y2, r) {
  const j = () => (r() - 0.5) * 3;
  c.beginPath();

const platform = {

        await this.writeHandle(h, blob);

  // Resolves to {name, text, handle} or null if cancelled.
  async openText() {

document.addEventListener('keydown', e => {
  if (!(e.metaKey || e.ctrlKey)) return;
  const k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); saveDoc(); }
  else if (k === 'o') { e.preventDefault(); openDoc(); }
});

// Draggable divider between the panes (stacks vertically on narrow screens).
(() => {
  const div = $('divider'), left = $('left'), app = $('app');
  div.addEventListener('pointerdown', e => {
    div.setPointerCapture(e.pointerId); div.classList.add('drag');
    const move = ev => {
      const r = app.getBoundingClientRect();
      const column = getComputedStyle(app).flexDirection === 'column';
      const pct = column ? (ev.clientY - r.top) / r.height * 100 : (ev.clientX - r.left) / r.width * 100;
      left.style.flexBasis = Math.min(80, Math.max(15, pct)) + '%';
    };
    const up = () => {
      div.classList.remove('drag');
      div.removeEventListener('pointermove', move); div.removeEventListener('pointerup', up);
      try { localStorage.setItem('breadboard.split', left.style.flexBasis); } catch (err) {}
    };
    div.addEventListener('pointermove', move); div.addEventListener('pointerup', up);
  });
  try { const s = localStorage.getItem('breadboard.split'); if (s) left.style.flexBasis = s; } catch (err) {}
})();

new ResizeObserver(paint).observe(wrap);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);

let draft = null;
try { draft = localStorage.getItem('breadboard.draft.v2'); } catch (e) {}
loadDoc(draft && draft.trim() ? draft : SAMPLE, 'untitled.md', null);
</script>
</body>
